# 기존 nginx_proxy 설정(/home/ubuntu/UsUniverse/nginx/nginx.conf)의 http { ... } 안에
# 아래 server 블록들을 둔다. (오테식 매니저용, otesik.duckdns.org → tennis-frontend:5555)
# 예전 주소 13.125.173.69.sslip.io 는 새 주소로 넘긴다(이미 공유된 링크 유지).
#
# 순서 주의 — 443 블록은 인증서 파일이 없으면 nginx가 못 떠서, 같은 프록시를 쓰는 다른 사이트까지 전부 멈춘다:
#   1) [A] 블록만 추가 → 재시작 → certbot으로 otesik 인증서 발급
#   2) [B] 블록 추가 + 기존 sslip 블록 2개를 [C]로 교체 → 임시 컨테이너로 검증 → 재시작
#   (자세한 명령은 deploy/DEPLOY.md "주소 변경: otesik.duckdns.org")

# --- [A] otesik 80: 인증서 발급(ACME 챌린지) + HTTPS로 이동 ---
server {
    listen 80;
    server_name otesik.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://otesik.duckdns.org$request_uri;
    }
}

# --- [B] otesik 443: 오테식 매니저 (frontend 컨테이너로 프록시) ---
server {
    listen 443 ssl;
    server_name otesik.duckdns.org;
    resolver 127.0.0.11 valid=30s;

    ssl_certificate     /etc/letsencrypt/live/otesik.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otesik.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $tennis tennis-frontend;
        proxy_pass http://$tennis:5555;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- [C] 예전 주소(sslip.io): 새 주소로 넘김 — 기존 sslip 블록 2개를 이걸로 교체 ---
# ACME 경로는 남겨 둔다(sslip 인증서 갱신이 실패하면 만료 후엔 넘김조차 인증서 오류가 난다).
server {
    listen 80;
    server_name 13.125.173.69.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://otesik.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 13.125.173.69.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/13.125.173.69.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.125.173.69.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://otesik.duckdns.org$request_uri;
}
